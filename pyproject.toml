[project]
name = "agentic-workshop"
version = "0.1.0"
description = "VSF Club Agentic AI Workshop: a support-ticket triage agent built spec-first with BMad."
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-google-genai>=2.1",
    "langchain-groq>=0.3",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.9",
    "mlflow>=3.4",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# mlflow (a direct dependency) requires cryptography<51,>=43.0.0, which
# resolves to 50.x by default; google-auth (behind langchain-google-genai)
# also depends on cryptography. cryptography 50 has no macOS x86_64 wheel
# and fails to build from source there, so pin it down on that platform
# only -- other platforms can use the normal resolved version.
override-dependencies = [
    "cryptography==45.0.5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
